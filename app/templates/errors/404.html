{% extends "base.html" %}
{% block title %}Page Not Found — {{ center_name() }}{% endblock %}
{% block body %}
<div class="flex min-h-screen items-center justify-center px-4">
  <div class="text-center">
    <p class="text-6xl font-extrabold text-brand-700">404</p>
    <h1 class="mt-2 text-2xl font-bold text-slate-900">Page Not Found</h1>
    <p class="mt-2 text-slate-500">The page you're looking for does not exist or has been moved.</p>
    <a href="{{ url_for('website.home') }}" class="btn-primary mt-6">Go to Homepage</a>
  </div>
</div>
{% endblock %}
